[project]
name = "arclet-entari"
dynamic = ["version"]
description = "Simple IM Framework based on satori-python"
authors = [
    {name = "RF-Tar-Railt",email = "rf_tar_railt@qq.com"},
]
dependencies = [
    "arclet-letoderea<0.23.0,>=0.22.1",
    "arclet-alconna<2.0.0,>=1.8.44",
    "satori-python-core<1.4.0,>=1.3.11",
    "satori-python-client<1.4.0,>=1.3.11",
    "arclet-alconna-tools>=0.7.12",
    "nonestorage>=0.1.0",
    "simpleeval>=1.0.8",
]
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Topic :: Communications :: Chat",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: AsyncIO",
    "Operating System :: OS Independent",
]
keywords = [
    "asyncio",
    "framework",
    "instant-messaging",
    "satori",
    "entari",
    "plugin-system",
    "hmr",
    "hot",
    "module",
    "replacement",
    "reload",
    "watch",
    "development",
    "hot-reload",
    "hot-module-replacement",
    "high-performance",
    "event-driven",
]

[project.urls]
homepage = "https://arclet.top"
repository = "https://github.com/ArcletProject/Entari"

[project.optional-dependencies]
yaml = [
    "ruamel-yaml>=0.19.1",
]
cron = [
    "croniter>=6.0.0",
]
reload = [
    "watchfiles>=1.3.0",
]
dotenv = [
    "python-dotenv>=1.2.4",
]
full = [
    "croniter>=6.0.0",
    "watchfiles>=1.3.0",
    "python-dotenv>=1.2.4",
    "ruamel-yaml>=0.19.1",
    "entari-cli>=0.4.0",
]
pydantic = [
    "pydantic>=2.10.6",
]
msgspec = [
    "msgspec>=0.19.0",
]
toml = [
    "tomlkit>=0.13.3",
]
cli = [
    "entari-cli>=0.4.0",
]
rich = [
    "rich>=14.1.0",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
[tool.pdm.build]
includes = ["arclet"]

[tool.pdm.version]
source = "file"
path = "arclet/entari/__init__.py"

[tool.black]
line-length = 120
target-version = ["py311", "py312", "py313", "py314", "py315"]
include = '\.pyi?$'
extend-exclude = '''
'''

[tool.ruff]
line-length = 120
target-version = "py311"
include = ["arclet/**.py"]
respect-gitignore = true

[tool.ruff.lint]
select = ["E", "W", "F", "UP", "C", "T", "PYI", "PT", "Q"]
ignore = ["C901", "T201", "E731", "E402", "PYI055"]

[tool.ruff.lint.isort]
force-sort-within-sections = false
extra-standard-library = ["typing_extensions"]

[tool.pyright]
pythonVersion = "3.11"
pythonPlatform = "All"
typeCheckingMode = "basic"

[tool.pdm.scripts]
test = "pytest -v -n auto -W ignore ./tests/"
format = { composite = ["ruff check --select I --fix ./arclet/","black ./arclet/","ruff check ./arclet/"] }

[dependency-groups]
dev = [
    "black>=26.10.1",
    "ruff>=0.17.1",
    "watchfiles>=1.3.0",
    "python-dotenv>=1.2.4",
    "ruamel-yaml>=0.19.1",
    "msgspec>=0.21.0",
    "pydantic>=2.12.5",
    "tomlkit>=0.13.3",
    "richuru>=0.1.1",
]
